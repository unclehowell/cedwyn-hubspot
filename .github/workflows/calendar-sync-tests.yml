name: calendar-sync-tests

on:
  push:
    branches: [main, feature/google-calendar-hubsync]
    paths:
      - "workers/calendar-sync/**"
      - ".github/workflows/calendar-sync-tests.yml"
  pull_request:
    paths:
      - "workers/calendar-sync/**"
      - ".github/workflows/calendar-sync-tests.yml"

permissions:
  contents: read

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run domain tests
        run: node --test workers/calendar-sync/tests/*.test.mjs
